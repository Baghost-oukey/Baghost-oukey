name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pacman Graph
        uses: platane/snk@v3
        with:
          github_user_name: Baghost-oukey
          outputs: |
            dist/pacman-contribution-graph.svg?color_snake=#fce303&color_dots=#bfbfbf,#9be9a8,#40c463,#30a14e,#216e39
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&color_snake=#fce303&color_dots=#101216,#0e4429,#006d32,#26a641,#39d353
          
      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
